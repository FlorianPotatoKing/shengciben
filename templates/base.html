<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f6ef7">
  <title>{% block title %}生词本{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if session.user_id %}
  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="{{ url_for('index') }}">📚 生词本</a>
      <div class="nav-links">
        <a href="{{ url_for('index') }}">单词</a>
        <a href="{{ url_for('phrases') }}">短语</a>
        <a href="{{ url_for('sentences') }}">句子</a>
        <a href="{{ url_for('review') }}">复习</a>
        <span class="nav-user">{{ session.username }}</span>
        <a class="nav-logout" href="{{ url_for('logout') }}">退出</a>
      </div>
    </div>
  </nav>
  {% endif %}

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="flash flash-{{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
