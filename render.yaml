services:
  - type: web
    name: shengciben
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /data/vocab.db
    disk:
      name: vocab-data
      mountPath: /data
      sizeGB: 1
